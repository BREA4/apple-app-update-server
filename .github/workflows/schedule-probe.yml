name: Schedule probe
run-name: Schedule probe (${{ github.event_name }})

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record the trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: printf 'Trigger event is %s\n' "$TRIGGER_EVENT"
